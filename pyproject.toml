[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waam-validator"
version = "2.0.0"
description = "Deterministic three-robot WAAM path validation simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "polars==1.44.0",
  "PyYAML==6.0.3",
  "pydantic==2.13.4",
  "shapely==2.1.2",
  "trimesh==5.0.0",
  "fast-simplification==0.2.0",
  "matplotlib==3.11.1",
  "plotly==6.9.0",
  "dash==4.4.1",
  "typer==0.27.1",
  "mapbox-earcut==2.0.0",
  "networkx==3.6.1",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "psutil==7.2.2",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
waam-validator = "waam_validator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waam_validator = ["dashboard/assets/*.css"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not performance'"
testpaths = ["tests"]
markers = [
  "performance: resource-intensive performance acceptance tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["waam_validator"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*", "trimesh", "trimesh.*", "matplotlib", "matplotlib.*", "plotly", "plotly.*"]
ignore_missing_imports = true
