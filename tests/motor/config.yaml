# Derived from Multi_robot_DED_NCO/runs/motor_inner_waam_trajectory_20260825/source_config.yaml.
# NCO R0/R1/R2 map to Validator robot IDs 1/2/3.
# Source mock_arm_radius_mm is mapped to both TCP and 2D Arm Capsule radii.
simulation:
  max_time_step_s: 0.1
  max_tcp_step_mm: 5.0
  event_merge_gap_s: 0.2
  batch_size: 10000
robots:
  - id: 1
    base_xyz_mm: [-1000.0, 0.0, 0.0]
    tcp_radius_mm: 75.0
    arm_envelope_radius_mm: 75.0
    reach_radius_mm: 2000.0
  - id: 2
    base_xyz_mm: [500.0, -866.0254, 0.0]
    tcp_radius_mm: 75.0
    arm_envelope_radius_mm: 75.0
    reach_radius_mm: 2000.0
  - id: 3
    base_xyz_mm: [500.0, 866.0254, 0.0]
    tcp_radius_mm: 75.0
    arm_envelope_radius_mm: 75.0
    reach_radius_mm: 2000.0
process:
  deposition_speed_mm_s: 10.0
  travel_speed_mm_s: 150.0
  layer_height_mm: 2.0
  bead_width_mm: 22.0
  build_plane_z_mm: 0.0
  # The exported D planes are 4, 6, 8, ... mm.
  tcp_z_reference: top
workspace:
  shape: circle_xy
  center_xy_mm: [0.0, 0.0]
  radius_mm: 500.0
collision:
  check_arm_envelope: true
  arm_clearance_mm: 50.0
  check_tcp_radius: true
  touching_is_collision: true
  geometry_epsilon_mm: 1.0e-06
validation:
  wait_position_tolerance_mm: 0.001
  layer_z_tolerance_mm: 0.25
  speed_relative_tolerance: 0.1
  fail_on_speed_violation: true
  require_watertight_target: true
  attempt_target_repair: true
  target_volume_discrepancy_warning_ratio: 0.02
shape_validation:
  polygon_buffer_resolution: 8
  polygon_snap_tolerance_mm: 0.0001
  # NCO stage1 max_uncovered_ratio=0.25 and max_overfill_ratio=0.50.
  minimum_overall_coverage: 0.75
  maximum_overall_overfill_ratio: 0.50
  # NCO has no equivalent IoU thresholds; retain Validator defaults.
  minimum_overall_iou: 0.9
  minimum_layer_iou: 0.8
  maximum_failed_layer_ratio: 0.05
  area_epsilon_mm2: 1.0e-06
output:
  save_summary_json: true
  save_report_markdown: true
  save_collision_events_csv: true
  save_robot_metrics_csv: true
  save_layer_metrics_csv: true
  save_deposited_stl: true
  save_static_plots: true
  animation_sample_interval_s: 1.0
